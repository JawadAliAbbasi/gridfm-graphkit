version: 1
callbacks:
  patience: 100
  tol: 0
  early_stopping_monitor: Validation loss
  checkpoint_monitor: Validation layer_11_residual
  lr_scheduler_monitor: Validation loss
task:
  task_name: PowerFlow
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case57_ieee
  scenarios:
  - 250000
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 32 # 1 gpu
  split_by_load_scenario_idx: true
  stream_partitions: auto
model:
  attention_head: 8
  # --- CoED: learnable continuous edge directions -------------------------
  # One angle per undirected branch, per layer, in [0, pi/2]; init pi/4, which
  # is an exact no-op, so epoch 0 matches the baseline bit for bit.
  # Per-layer is deliberate: the projected edge representation is built once
  # outside the layer loop, so a single shared theta would apply the same
  # prior at all `num_layers` layers and compound with depth.
  # num_undirected_branches must equal the branch count of the single fixed
  # topology in `data.networks`; a mismatch raises rather than mis-binding.
  coed: true
  num_undirected_branches: 80   # case57_ieee
  edge_dim: 10
  hidden_size: 48
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  type: AdamW
  learning_rate: 0.0005
  # Separate, larger LR for theta: each layer's angles see gradient only from
  # their own layer. The CoED reference uses 5e-3 for its power-grid task.
  # Weight decay is forced to 0 for this group in BaseTask.configure_optimizers.
  theta_learning_rate: 0.005
  optimizer_params:
    betas: [0.9, 0.999]
  scheduler_type:  ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7      # previously lr_decay
    patience: 5      # previously lr_patience
seed: 0
training:
  batch_size: 64 # 1 gpu
  epochs: 200
  loss_weights:
  - 0.1
  - 0.9
  losses:
  - LayeredWeightedPhysics
  - MaskedBusMSE
  loss_args:
  - base_weight: 0.5
  - {}
  accelerator: auto
  devices: auto
  strategy: auto
verbose: true
